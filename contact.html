<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | JM Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/logo.png">

    <link rel="apple-touch-icon" sizes="180x180" href="assets/logo.png">

    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Outfit', 'sans-serif'] }, 
                    colors: { primary: '#0f172a', secondary: '#00b4d8', accent: '#0077b6' },
                    animation: {
                        'fade-up': 'fadeUp 0.8s ease-out forwards',
                    },
                    keyframes: {
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                } 
            }
        }
    </script>
    <style>
        /* Smooth Page Transition Entrance */
        body { opacity: 0; animation: pageFadeIn 0.4s ease-out forwards; }
        @keyframes pageFadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Hide scrollbars */
        ::-webkit-scrollbar { display: none; }
        html { -ms-overflow-style: none; scrollbar-width: none; }

        /* --- PREVENT COPY, HIGHLIGHT & POINTER INTERACTIONS --- */
        body {
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none; /* Firefox */
            -ms-user-select: none; /* IE10+/Edge */
            user-select: none; /* Standard */
        }
        
        /* Allow typing in form fields */
        input, textarea {
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
            cursor: text !important;
        }

        /* Prevent image dragging natively */
        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            -user-drag: none;
        }

        /* Force normal cursor on all clickable elements to hide links */
        a, button, [data-href] {
            cursor: default !important;
        }
        
        /* --- INTERACTIVE ANIMATIONS --- */
        .stagger-1 { animation-delay: 0.1s; opacity: 0; }
        .stagger-2 { animation-delay: 0.3s; opacity: 0; }
        .stagger-3 { animation-delay: 0.5s; opacity: 0; }
    </style>
</head>
<body class="bg-[#f8fafc] text-gray-800 font-sans antialiased flex flex-col min-h-screen selection:bg-secondary selection:text-white select-none" oncontextmenu="return false;">

    <nav class="fixed w-full bg-white/80 backdrop-blur-md shadow-sm z-50 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                
                <div class="flex-shrink-0 flex items-center">
                    <a data-href="index.html" class="block hover:opacity-80 transition-opacity duration-300">
                        <img src="assets/logo.png" alt="JMR Logo" class="h-12 w-auto object-contain rounded-md pointer-events-none" draggable="false">
                    </a>
                </div>
                
                <div class="hidden md:flex space-x-8 items-center text-sm lg:text-base">
                    <a data-href="index.html" class="text-gray-500 hover:text-primary font-medium transition-colors relative group">
                        Home
                        <span class="absolute -bottom-1.5 left-0 w-0 h-0.5 bg-secondary transition-all duration-300 group-hover:w-full rounded-full"></span>
                    </a>
                    
                    <a data-href="about.html" class="text-gray-500 hover:text-primary font-medium transition-colors relative group">
                        About
                        <span class="absolute -bottom-1.5 left-0 w-0 h-0.5 bg-secondary transition-all duration-300 group-hover:w-full rounded-full"></span>
                    </a>

                    <a data-href="projects.html" class="text-gray-500 hover:text-primary font-medium transition-colors relative group">
                        Projects
                        <span class="absolute -bottom-1.5 left-0 w-0 h-0.5 bg-secondary transition-all duration-300 group-hover:w-full rounded-full"></span>
                    </a>

                    <a data-href="resume.html" class="text-gray-500 hover:text-primary font-medium transition-colors relative group">
                        Resume
                        <span class="absolute -bottom-1.5 left-0 w-0 h-0.5 bg-secondary transition-all duration-300 group-hover:w-full rounded-full"></span>
                    </a>

                    <a data-href="blog.html" class="text-gray-500 hover:text-primary font-medium transition-colors relative group">
                        Blog
                        <span class="absolute -bottom-1.5 left-0 w-0 h-0.5 bg-secondary transition-all duration-300 group-hover:w-full rounded-full"></span>
                    </a>

                    <a data-href="contact.html" class="bg-secondary text-white px-6 py-2.5 rounded-full shadow-lg shadow-secondary/30 transition-all duration-300 font-bold">Contact Me</a>
                </div>

                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" class="text-gray-600 hover:text-primary focus:outline-none p-2 rounded-lg hover:bg-gray-100 transition-colors">
                        <svg class="h-6 w-6 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden bg-white/95 backdrop-blur-xl border-t border-gray-100 shadow-2xl absolute w-full z-40 top-20">
            <div class="px-4 pt-4 pb-6 space-y-2">
                <a data-href="index.html" class="block px-4 py-3 text-gray-600 hover:text-primary hover:bg-gray-50 rounded-xl font-medium transition-colors">Home</a>
                <a data-href="about.html" class="block px-4 py-3 text-gray-600 hover:text-primary hover:bg-gray-50 rounded-xl font-medium transition-colors">About</a>
                <a data-href="projects.html" class="block px-4 py-3 text-gray-600 hover:text-primary hover:bg-gray-50 rounded-xl font-medium transition-colors">Projects</a>
                <a data-href="resume.html" class="block px-4 py-3 text-gray-600 hover:text-primary hover:bg-gray-50 rounded-xl font-medium transition-colors">Resume</a>
                <a data-href="blog.html" class="block px-4 py-3 text-gray-600 hover:text-primary hover:bg-gray-50 rounded-xl font-medium transition-colors">Blog</a>
                
                <a data-href="contact.html" class="block px-4 py-3 text-white bg-secondary rounded-xl font-bold mt-4 text-center shadow-md shadow-secondary/20 transition-shadow duration-300">Contact Me</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-32 pb-20">
        <section id="contact">
            <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="text-center mb-12 animate-fade-up">
                    <h2 class="text-4xl font-extrabold text-primary">Let's Work Together</h2>
                    <div class="w-24 h-1.5 bg-gradient-to-r from-secondary to-accent mx-auto mt-6 rounded-full mb-6"></div>
                    <p class="text-lg text-gray-600 pointer-events-none">Currently open for new opportunities and collaborations.</p>
                </div>
                
                <form id="contactForm" class="space-y-6 bg-white p-8 md:p-12 rounded-3xl border border-gray-100 shadow-xl shadow-gray-200/50 animate-fade-up stagger-1">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="name" class="block text-sm font-bold text-gray-700 mb-2 pointer-events-none">Name</label>
                            <input type="text" id="name" class="w-full px-5 py-4 bg-gray-50 rounded-2xl border-2 border-transparent focus:bg-white focus:border-secondary focus:ring-4 focus:ring-secondary/10 outline-none transition-all font-medium text-gray-800" placeholder="John Doe" required>
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-bold text-gray-700 mb-2 pointer-events-none">Email</label>
                            <input type="email" id="email" class="w-full px-5 py-4 bg-gray-50 rounded-2xl border-2 border-transparent focus:bg-white focus:border-secondary focus:ring-4 focus:ring-secondary/10 outline-none transition-all font-medium text-gray-800" placeholder="john@example.com" required>
                        </div>
                    </div>
                    <div>
                        <label for="message" class="block text-sm font-bold text-gray-700 mb-2 pointer-events-none">Message</label>
                        <textarea id="message" rows="6" class="w-full px-5 py-4 bg-gray-50 rounded-2xl border-2 border-transparent focus:bg-white focus:border-secondary focus:ring-4 focus:ring-secondary/10 outline-none transition-all font-medium text-gray-800 resize-none" placeholder="How can I help you?" required></textarea>
                    </div>
                    <button type="submit" class="w-full bg-primary text-white font-bold py-4 px-8 rounded-full hover:bg-secondary hover:shadow-xl transition-all duration-300 text-lg">
                        Send Message
                    </button>
                </form>
            </div>
        </section>
    </main>

    <footer class="bg-white border-t border-gray-100 py-8 text-center mt-auto">
        <div class="max-w-7xl mx-auto px-4 flex flex-col items-center">
            <p class="text-sm text-gray-500 pointer-events-none">&copy; <span id="year"></span> JMR Portfolio. All rights reserved.</p>
        </div>
    </footer>

 <script>
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F5' || (e.ctrlKey && e.key === 'r') || (e.metaKey && e.key === 'r')) { e.preventDefault(); return false; }
            if (e.ctrlKey && (e.key === 's' || e.key === 'S' || e.key === 'p' || e.key === 'P' || e.key === 'u' || e.key === 'U')) { e.preventDefault(); return false; }
            if (e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J' || e.key === 'c' || e.key === 'C')) { e.preventDefault(); return false; }
        });

        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        btn.addEventListener('click', () => menu.classList.toggle('hidden'));
        
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('year').textContent = new Date().getFullYear();
        });

        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            const targetEmail = "jmr.businessacc@gmail.com";
            
            const subject = encodeURIComponent(`Portfolio Inquiry from ${name}`);
            const body = encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\nMessage:\n${message}`);
            
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (isMobile) {
                window.location.href = `mailto:${targetEmail}?subject=${subject}&body=${body}`;
            } else {
                const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${targetEmail}&su=${subject}&body=${body}`;
                window.open(gmailUrl, '_blank');
            }
        });

        document.querySelectorAll('[data-href]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                const target = this.getAttribute('data-href');
                if (target) {
                    e.preventDefault();
                    sessionStorage.setItem('jmr_internal_nav', 'true');
                    document.body.style.transition = 'opacity 0.3s ease';
                    document.body.style.opacity = '0';
                    setTimeout(() => { window.location.href = target; }, 300);
                }
            });
        });

        // TRUE GLOBAL SYNCHRONIZED COUNTER (Background)
        document.addEventListener('DOMContentLoaded', () => {
            const namespace = 'jmr_portfolio_global_sync';
            const key = 'total_visits';
            
            const upUrl = `https://abacus.jasoncameron.dev/hit/${namespace}/${key}`;
            const readUrl = `https://abacus.jasoncameron.dev/get/${namespace}/${key}`;

            const navEntries = performance.getEntriesByType("navigation");
            const navType = navEntries.length > 0 ? navEntries[0].type : '';
            const isInternalNav = sessionStorage.getItem('jmr_internal_nav') === 'true';

            sessionStorage.removeItem('jmr_internal_nav');

            let shouldCountVisit = false;
            if (navType === 'reload') shouldCountVisit = true;
            else if (navType === 'navigate' && !isInternalNav) shouldCountVisit = true;

            async function processVisitorCount() {
                try {
                    let endpoint = shouldCountVisit ? upUrl : readUrl;
                    let response = await fetch(endpoint);
                    
                    if (!response.ok) {
                        const fallbackUp = `https://api.counterapi.dev/v1/${namespace}/${key}/up`;
                        const fallbackRead = `https://api.counterapi.dev/v1/${namespace}/${key}`;
                        response = await fetch(shouldCountVisit ? fallbackUp : fallbackRead);
                        if (!response.ok) throw new Error('API Blocked');
                    }
                    
                    const data = await response.json();
                    const globalCount = data.value !== undefined ? data.value : data.count;
                    
                    if (globalCount !== undefined) {
                        localStorage.setItem('jmr_true_global_count', globalCount);
                    } else {
                        throw new Error('No count returned');
                    }
                } catch (error) {
                    let fallbackCount = parseInt(localStorage.getItem('jmr_true_global_count')) || 1;
                    if (shouldCountVisit) fallbackCount += 1;
                    localStorage.setItem('jmr_true_global_count', fallbackCount);
                }
            }
            processVisitorCount();
        });
    </script>
</body>
</html>
